<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>현장 장부</title>
<style>
:root{
  --paper:#eef6f3; --card:#ffffff; --ink:#12332e; --soft:#5b7a73;
  --teal:#0f6b5e; --rule:#cfe3dd; --amber:#b7791f; --amberbg:#fdf3e1;
  --red:#b42318; --redbg:#fdecea;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background:var(--paper);color:var(--ink);font-size:15px;
  padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:10;background:var(--teal);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:700;letter-spacing:-.3px}
#net{font-size:12px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.16)}
#net.off{background:#e0a43a;color:#3a2600}
main{max-width:640px;margin:0 auto;padding:14px 14px 40px}

.pad{background:var(--card);border-radius:14px;border:1px solid var(--rule);overflow:hidden}
.pad-top{height:10px;background:#e0a43a}
textarea{width:100%;min-height:128px;border:0;outline:0;resize:vertical;padding:4px 14px 8px;
  font:inherit;font-size:16px;color:var(--ink);line-height:32px;background:transparent;
  background-image:repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local}
textarea::placeholder{color:#9bb3ad}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-top:1px solid var(--rule)}
.chip{flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--teal);
  padding:6px 11px;border-radius:16px;font:inherit;font-size:13px;font-weight:600}
.save{display:block;width:100%;margin-top:10px;padding:15px;border:0;border-radius:12px;
  background:var(--teal);color:#fff;font:inherit;font-size:16px;font-weight:700}
.save:active{opacity:.85}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #e0a43a;outline-offset:2px}

#preview{margin-top:10px;display:grid;gap:6px}
.pv{font-size:13px;background:#fff;border:1px dashed #9cc9bd;border-radius:10px;padding:8px 10px;color:var(--soft)}
.pv b{color:var(--ink)}
.pv .warn{color:var(--red)}

.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin:18px 0 12px}
.sum div{background:#fff;padding:10px 6px;text-align:center}
.sum small{display:block;font-size:11px;color:var(--soft);margin-bottom:3px}
.sum strong{font-size:14px}
.sum .m strong{color:var(--teal)} .sum .u strong{color:var(--amber)}

.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--rule);background:#fff;
  font:inherit;font-size:13px;font-weight:600;color:var(--soft)}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.row{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:11px 12px;margin-bottom:8px;
  display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer}
.row.chk{border-color:#f1b7b0;background:#fffafa}
.row .t{font-weight:700;font-size:15px}
.row .t span{font-weight:500;color:var(--soft);margin-left:4px}
.row .d{font-size:12px;color:var(--soft)}
.row .money{text-align:right;font-size:13px;color:var(--soft);line-height:1.5}
.row .money b{color:var(--teal);font-size:15px}
.tags{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/-1;margin-top:2px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--paper);color:var(--soft)}
.tag.unpaid{background:var(--amberbg);color:var(--amber);font-weight:700}
.tag.paid{background:#e3f4ee;color:var(--teal)}
.tag.pend{background:#fff4d6;color:#8a5a00}
.tag.warn{background:var(--redbg);color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--soft);padding:30px 10px;font-size:14px}

.sheet-bg{position:fixed;inset:0;background:rgba(18,51,46,.45);display:none;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:18px 18px 0 0;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:88vh;overflow:auto;
  transform:translateY(100%);transition:transform .22s ease;max-width:640px;margin:0 auto}
.open .sheet-bg{display:block} .open .sheet{transform:none}
.sheet h2{font-size:16px;margin-bottom:4px}
.raw{font-size:13px;color:var(--soft);background:var(--paper);padding:8px 10px;border-radius:8px;margin:6px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--soft);margin-bottom:10px}
label input,label select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--rule);
  border-radius:8px;font:inherit;font-size:15px;color:var(--ink);background:#fff}
.chkline{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);margin:4px 0 14px}
.chkline input{width:20px;height:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{padding:13px;border-radius:10px;border:1px solid var(--rule);background:#fff;font:inherit;font-weight:700;color:var(--ink)}
.btns .pri{background:var(--teal);color:#fff;border-color:var(--teal);grid-column:1/-1}
.btns .del{color:var(--red)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1><a href="/" style="color:#fff;text-decoration:none">‹ 홈</a> &nbsp;현장 장부</h1>
  <div id="net">연결 확인중</div>
</header>

<main>
  <div class="pad">
    <div class="pad-top"></div>
    <textarea id="memo" placeholder="인하우스 102호 폽업 8천 사서 수리, 3만 청구&#10;한 줄에 한 건씩 적으세요"></textarea>
    <div class="chips" id="chips"></div>
  </div>
  <button class="save" id="saveBtn">장부에 적기</button>
  <div id="preview"></div>

  <div class="sum" id="sum"></div>
  <div class="seg" id="seg">
    <button data-f="all" class="on">전체</button>
    <button data-f="unpaid">미수</button>
    <button data-f="check">확인필요</button>
    <button data-f="pend">올라갈 것</button>
  </div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
</main>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-label="장부 수정">
    <h2>장부 수정</h2>
    <div class="raw" id="eRaw"></div>
    <div class="g2">
      <label>날짜<input type="date" id="eDate"></label>
      <label>구분<select id="eKind">
        <option>수리</option><option>교체</option><option>설치</option><option>이사정산</option><option>구매</option><option>기타</option>
      </select></label>
      <label>빌라<input id="eVilla" list="villaList"></label>
      <label>호수<input id="eUnit" inputmode="numeric"></label>
    </div>
    <label>품목·내용<input id="eItem"></label>
    <div class="g2">
      <label>매입가(원)<input id="eCost" inputmode="numeric"></label>
      <label>청구가(원)<input id="eCharge" inputmode="numeric"></label>
      <label>청구대상<select id="eTarget"><option>건물주</option><option>세입자</option></select></label>
      <label>마진<input id="eMargin" disabled></label>
    </div>
    <div class="chkline"><input type="checkbox" id="ePaid"><label for="ePaid" style="margin:0;color:var(--ink);font-size:15px">입금 받음</label></div>
    <div class="btns">
      <button class="pri" id="eSave">저장</button>
      <button id="eMsg">청구문자 복사</button>
      <button class="del" id="eDel">삭제</button>
    </div>
  </div>
</div>
<datalist id="villaList"></datalist>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase (빌라관리 앱과 같은 프로젝트) ===== */
firebase.initializeApp({
  apiKey:"AIzaSyBrMcbN2Iv3hjBW0uQx7_gSXAWcwTTSgGI",
  authDomain:"villa-management-4af75.firebaseapp.com",
  projectId:"villa-management-4af75",
  storageBucket:"villa-management-4af75.firebasestorage.app",
  messagingSenderId:"994416353525",
  appId:"1:994416353525:web:3bd200acc5d68f6df065bc"
});
const db = firebase.firestore();
// 오프라인 저장: 끊겨도 폰에 저장 → 연결되면 자동 업로드
db.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn('persistence',e.code));

const LEDGER = 'ledger';           // 장부가 저장되는 컬렉션
const BIZ = 'B.D씽크';             // 청구문자에 들어가는 상호

let villas = JSON.parse(localStorage.getItem('villas-cache')||'[]');
let entries = [];
let filter = 'all';
let editing = null;

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => (n===null||n===undefined||n==='') ? '-' : Number(n).toLocaleString('ko-KR');
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const toNum = s => { const v = String(s??'').replace(/[^\d.-]/g,''); return v==='' ? null : Math.round(Number(v)); };

/* ===== 메모 한 줄 → 장부 항목 ===== */
function parseLine(line){
  const src = line.trim();
  let t = ' '+src+' ';
  const now = new Date(); let d = new Date(now);

  if(/그저께|그제/.test(t)){ d.setDate(d.getDate()-2); t=t.replace(/그저께|그제/,' '); }
  else if(/어제/.test(t)){ d.setDate(d.getDate()-1); t=t.replace(/어제/,' '); }
  else if(/오늘/.test(t)){ t=t.replace(/오늘/,' '); }
  let dm = t.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/) || t.match(/(?<![\d.])(\d{1,2})\/(\d{1,2})(?![\d])/);
  if(dm){ d = new Date(now.getFullYear(), +dm[1]-1, +dm[2]); t=t.replace(dm[0],' '); }

  // 빌라: 등록된 빌라 이름 우선, 없으면 ~하우스/빌라 같은 단어
  let villa='';
  for(const v of [...villas].sort((a,b)=>b.length-a.length)){
    if(v && t.includes(v)){ villa=v; t=t.replace(v,' '); break; }
  }
  if(!villa){
    const m = t.match(/[^\s\d]+(하우스|빌라|빌|맨션|타운|팰리스|힐스|힐|캐슬|파크|하임|빌리지)/);
    if(m){ villa=m[0]; t=t.replace(m[0],' '); }
  }

  // 숫자: 호수 / 수량 / 금액 구분
  const re = /(\d[\d,]*(?:\.\d+)?)\s*(?:(만)\s*(?:(\d+)\s*천)?|(천))?\s*(원)?/g;
  let unit='', m; const amts=[], spans=[];
  while((m = re.exec(t))){
    if(!m[0].trim()){ re.lastIndex++; continue; }
    const s=m.index, e=s+m[0].length, after=t.slice(e,e+10), before=t.slice(Math.max(0,s-8),s);
    let n = parseFloat(m[1].replace(/,/g,''));
    const hasWon = !!(m[2]||m[4]||m[5]);
    if(m[2]) n = n*10000 + (m[3] ? +m[3]*1000 : 0); else if(m[4]) n = n*1000;
    const ho = after.match(/^\s*호/);
    if(!hasWon && ho && !unit){ unit=m[1]; spans.push([s,e+ho[0].length]); continue; }
    if(!hasWon && /^\s*층/.test(after)) continue;
    const q = after.match(/^\s*(개|ea|EA|장|미터|m|롤|박스|통)/);
    if(!hasWon && q){ spans.push([s,e+q[0].length]); continue; }
    if(hasWon || n>=5000){ amts.push({n:Math.round(n),after,before}); spans.push([s,e]); continue; }
    if(!unit){ unit=m[1]; spans.push([s,e]); }
  }

  // 매입가 / 청구가 판단
  let cost=null, charge=null; const rest=[];
  for(const a of amts){
    const COST='사서|사고|샀|구입|구매|매입|줬|들었|주고|원가|자재비|사입', CHG='청구|받|판매|견적|수리비|공임';
    const kAfter = kw => { const r=a.after.match(new RegExp('^[^\\d]{0,7}?('+kw+')')); if(!r) return -1;
      return /^\s*\d/.test(a.after.slice(r[0].length).replace(/^[가-힣]*/,'')) ? -1 : r[0].length; };
    const kBefore = kw => { const r=a.before.match(new RegExp('('+kw+')[^\\d]{0,3}$')); if(!r) return -1;
      return /\d\s*(만|천|원)?\s*$/.test(a.before.slice(0,r.index)) ? -1 : a.before.length-r.index; };
    const cand=[['cost',kAfter(COST)],['charge',kAfter(CHG)],['cost',kBefore(COST)],['charge',kBefore(CHG)]]
      .filter(x=>x[1]>=0).sort((x,y)=>x[1]-y[1]);
    const k = cand.length ? cand[0][0] : null;
    if(k==='cost') cost=(cost||0)+a.n; else if(k==='charge') charge=(charge||0)+a.n; else rest.push(a.n);
  }
  if(rest.length){
    if(cost===null && charge===null){
      if(rest.length>=2){ cost=Math.min(...rest); charge=Math.max(...rest); } else charge=rest[0];
    } else if(cost===null) cost=rest.reduce((x,y)=>x+y,0);
    else if(charge===null) charge=rest.reduce((x,y)=>x+y,0);
  }

  // 남은 글자 = 품목/내용
  spans.sort((a,b)=>b[0]-a[0]).forEach(([s,e])=>{ t=t.slice(0,s)+' '+t.slice(e); });
  let item = t.replace(/(사서|사고|샀음|샀고|샀|구입해서|구입함|구입|구매|매입|청구함|청구했음|청구|받음|받았음|받기로|받을|입금완료|입금됨|입금|완납|건물주|건주|세입자|임차인|에게|한테|주고|원가)/g,' ')
    .replace(/[,.·]/g,' ').replace(/\s(에|에서|을|를|원|하고|해서|후|및)\s/g,' ').replace(/\s+/g,' ').trim();

  let kind='기타';
  if(/이사|정산/.test(src)) kind='이사정산';
  else if(/교체|갈아/.test(src)) kind='교체';
  else if(/설치/.test(src)) kind='설치';
  else if(/수리|고침|고쳤|as|a\/s|에이에스/i.test(src)) kind='수리';
  else if(cost!==null && charge===null) kind='구매';

  const target = /세입자|임차인|세입/.test(src) ? '세입자' : '건물주';
  const paid = /입금완료|입금됨|받음|받았|완납|결제완료/.test(src);
  const margin = (charge??0)-(cost??0);
  const needsCheck = kind==='구매' ? cost===null : (!villa || !unit || charge===null);
  return {date:ymd(d), villa, unit, item, kind, cost, charge, margin, target, paid, needsCheck};
}

/* ===== 저장 (오프라인이면 폰에 대기 → 자동 업로드) ===== */
function saveMemo(){
  const lines = $('memo').value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('메모를 먼저 적어주세요'); $('memo').focus(); return; }
  lines.forEach((raw,i)=>{
    const p = parseLine(raw);
    db.collection(LEDGER).add({...p, raw, createdAt: Date.now()+i})
      .catch(e=>toast('저장 실패: '+e.message));
  });
  $('memo').value=''; localStorage.removeItem('memo-draft'); renderPreview();
  toast(navigator.onLine ? `${lines.length}건 적었어요` : `${lines.length}건 폰에 저장, 연결되면 올라가요`);
}

/* ===== 실시간 동기화 ===== */
db.collection('villas').onSnapshot(s=>{
  const names = s.docs.map(d=>d.data().name).filter(Boolean);
  if(names.length){ villas=[...new Set(names)]; localStorage.setItem('villas-cache',JSON.stringify(villas)); }
  renderChips();
},()=>renderChips());

db.collection(LEDGER).orderBy('createdAt','desc').limit(500)
  .onSnapshot({includeMetadataChanges:true}, s=>{
    entries = s.docs.map(d=>({id:d.id, ...d.data(), pending:d.metadata.hasPendingWrites}));
    renderList(); renderNet();
  }, e=>{ $('list').innerHTML=`<div class="empty">장부를 못 불러왔어요 (${esc(e.code)}). Firestore 규칙에서 ledger 읽기·쓰기를 허용해주세요.</div>`; });

/* ===== 화면 ===== */
function renderChips(){
  $('chips').innerHTML = villas.length
    ? villas.map(v=>`<button class="chip" data-v="${esc(v)}">${esc(v)}</button>`).join('')
    : '<span style="font-size:12px;color:var(--soft);padding:4px">빌라관리 앱에 등록한 빌라가 여기 나와요</span>';
  $('villaList').innerHTML = villas.map(v=>`<option value="${esc(v)}">`).join('');
}
function renderPreview(){
  const lines = $('memo').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(-3);
  $('preview').innerHTML = lines.map(l=>{
    const p = parseLine(l);
    return `<div class="pv">${p.villa?`<b>${esc(p.villa)}</b>`:'<span class="warn">빌라?</span>'} ${p.unit?`<b>${esc(p.unit)}호</b>`:''} ${esc(p.item)||''}
      · 매입 <b class="num">${won(p.cost)}</b> · 청구 <b class="num">${won(p.charge)}</b> · 마진 <b class="num">${won(p.margin)}</b>
      ${p.needsCheck?' <span class="warn">확인필요</span>':''}</div>`;
  }).join('');
}
function renderNet(){
  const pend = entries.filter(e=>e.pending).length;
  const el=$('net');
  if(!navigator.onLine){ el.className='off'; el.textContent = pend?`오프라인 · 대기 ${pend}건`:'오프라인'; }
  else { el.className=''; el.textContent = pend?`올리는 중 ${pend}건`:'저장 완료'; }
}
function renderList(){
  const mon = ymd(new Date()).slice(0,7);
  const mEntries = entries.filter(e=>(e.date||'').startsWith(mon));
  const sum = k => mEntries.reduce((a,e)=>a+(Number(e[k])||0),0);
  const unpaid = entries.filter(e=>!e.paid && e.charge).reduce((a,e)=>a+Number(e.charge),0);
  $('sum').innerHTML = `
    <div><small>이번달 매입</small><strong class="num">${won(sum('cost'))}</strong></div>
    <div><small>이번달 청구</small><strong class="num">${won(sum('charge'))}</strong></div>
    <div class="m"><small>이번달 마진</small><strong class="num">${won(sum('charge')-sum('cost'))}</strong></div>
    <div class="u"><small>미수금 전체</small><strong class="num">${won(unpaid)}</strong></div>`;

  let list = entries;
  if(filter==='unpaid') list = entries.filter(e=>!e.paid && e.charge);
  if(filter==='check') list = entries.filter(e=>e.needsCheck);
  if(filter==='pend') list = entries.filter(e=>e.pending);
  if(!list.length){
    $('list').innerHTML = `<div class="empty">${filter==='all'?'아직 적은 게 없어요. 위에 한 줄 적고 "장부에 적기"를 누르세요.':'해당하는 항목이 없어요.'}</div>`;
    return;
  }
  $('list').innerHTML = list.map(e=>`
    <div class="row${e.needsCheck?' chk':''}" data-id="${e.id}">
      <div>
        <div class="t">${esc(e.villa)||'빌라?'} ${e.unit?esc(e.unit)+'호':''}<span>${esc(e.item)}</span></div>
        <div class="d">${esc(e.date)} · ${esc(e.kind)} · ${esc(e.target)}</div>
      </div>
      <div class="money num">매입 ${won(e.cost)}<br>청구 ${won(e.charge)}<br><b>${won(e.margin)}</b></div>
      <div class="tags">
        ${e.charge?(e.paid?'<span class="tag paid">입금완료</span>':'<span class="tag unpaid">미수</span>'):''}
        ${e.needsCheck?'<span class="tag warn">확인필요</span>':''}
        ${e.pending?'<span class="tag pend">연결되면 올라감</span>':''}
      </div>
    </div>`).join('');
}

/* ===== 수정 시트 ===== */
function openEdit(id){
  const e = entries.find(x=>x.id===id); if(!e) return; editing=e;
  $('eRaw').textContent = '원래 메모: '+(e.raw||'');
  $('eDate').value=e.date||''; $('eKind').value=e.kind||'기타';
  $('eVilla').value=e.villa||''; $('eUnit').value=e.unit||''; $('eItem').value=e.item||'';
  $('eCost').value=e.cost??''; $('eCharge').value=e.charge??''; $('eTarget').value=e.target||'건물주';
  $('ePaid').checked=!!e.paid; updMargin();
  document.body.classList.add('open');
}
function closeEdit(){ document.body.classList.remove('open'); editing=null; }
function updMargin(){ $('eMargin').value = won((toNum($('eCharge').value)??0)-(toNum($('eCost').value)??0)); }
function saveEdit(){
  if(!editing) return;
  const cost=toNum($('eCost').value), charge=toNum($('eCharge').value);
  db.collection(LEDGER).doc(editing.id).update({
    date:$('eDate').value, kind:$('eKind').value, villa:$('eVilla').value.trim(), unit:$('eUnit').value.trim(),
    item:$('eItem').value.trim(), cost, charge, margin:(charge??0)-(cost??0), target:$('eTarget').value,
    paid:$('ePaid').checked, needsCheck:false
  }).catch(e=>toast('수정 실패: '+e.message));
  closeEdit(); toast('저장했어요');
}
function delEdit(){
  if(!editing || !confirm('이 항목을 삭제할까요?')) return;
  db.collection(LEDGER).doc(editing.id).delete().catch(e=>toast('삭제 실패: '+e.message));
  closeEdit(); toast('삭제했어요');
}
function copyMsg(){
  const v=$('eVilla').value.trim(), u=$('eUnit').value.trim(), it=$('eItem').value.trim(), c=toNum($('eCharge').value);
  const msg=`[${BIZ}] ${v} ${u?u+'호 ':''}${it} 비용 ${won(c)}원 청구드립니다. 입금 부탁드립니다.`;
  (navigator.clipboard?.writeText(msg) || Promise.reject()).then(()=>toast('청구문자 복사했어요'),()=>prompt('복사해서 쓰세요',msg));
}

let tt; function toast(m){ const el=$('toast'); el.textContent=m; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

/* ===== 이벤트 ===== */
$('memo').value = localStorage.getItem('memo-draft')||'';
$('memo').addEventListener('input',()=>{ localStorage.setItem('memo-draft',$('memo').value); renderPreview(); });
$('memo').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)) saveMemo(); });
$('saveBtn').onclick = saveMemo;
$('chips').onclick = e=>{
  const v=e.target.dataset?.v; if(!v) return;
  const ta=$('memo'); const cur=ta.value;
  ta.value = cur + (cur && !cur.endsWith('\n') ? '\n' : '') + v + ' ';
  ta.focus(); ta.dispatchEvent(new Event('input'));
};
$('seg').onclick = e=>{
  const f=e.target.dataset?.f; if(!f) return; filter=f;
  [...$('seg').children].forEach(b=>b.classList.toggle('on',b.dataset.f===f)); renderList();
};
$('list').onclick = e=>{ const r=e.target.closest('.row'); if(r) openEdit(r.dataset.id); };
$('sheetBg').onclick = closeEdit;
$('eSave').onclick = saveEdit; $('eDel').onclick = delEdit; $('eMsg').onclick = copyMsg;
$('eCost').oninput = updMargin; $('eCharge').oninput = updMargin;
addEventListener('online', ()=>{ renderNet(); toast('연결됐어요. 대기중인 메모 올리는 중'); });
addEventListener('offline', renderNet);
renderChips(); renderPreview(); renderNet();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('sw',e));
}
</script>
</body>
