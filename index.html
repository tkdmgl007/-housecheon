<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>하우스주택관리</title>
<style>
:root{--paper:#eef6f3;--ink:#12332e;--soft:#5b7a73;--teal:#0f6b5e;--rule:#cfe3dd;--amber:#e0a43a;--amberbg:#fdf3e1;--amberink:#9a6414;--red:#b42318}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 8px}
.top h1{font-size:18px;font-weight:700}
.top small{font-size:12px;opacity:.8}
.tabs{display:flex}
.tabs a,.tabs button{flex:1;text-align:center;padding:11px 0;background:none;border:0;color:rgba(255,255,255,.7);
  font:inherit;font-size:15px;font-weight:700;text-decoration:none;border-bottom:3px solid transparent}
.tabs .on{color:#fff;border-bottom-color:var(--amber)}
.bar{position:sticky;z-index:10;background:var(--paper);padding:10px 12px 8px;border-bottom:1px solid var(--rule)}
.bar.hide{display:none}
.search{width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--rule);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:680px;margin:0 auto;padding:6px 12px 90px}
.dong{display:flex;align-items:baseline;gap:8px;margin:16px 4px 6px}
.dong h2{font-size:16px}
.dong span{font-size:12px;color:var(--soft)}
.list{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--rule);cursor:pointer}
.item:first-child{border-top:0}
.item .nm{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item b em{font-style:normal;font-size:12px;font-weight:600;color:var(--teal);background:var(--paper);padding:1px 7px;border-radius:9px;margin-left:6px;vertical-align:2px}
.item small{display:block;font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;padding:8px 11px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--teal);
  font:inherit;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer}
.btn.map,.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.empty{text-align:center;color:var(--soft);padding:30px 10px;font-size:14px;line-height:1.6}

/* 상세 */
.back{display:inline-block;margin:12px 0 4px;color:var(--teal);font-weight:700;text-decoration:none;font-size:14px}
.title{margin:2px 2px 12px}
.title h2{font-size:24px;letter-spacing:-.5px}
.title small{display:block;color:var(--soft);font-size:13px;margin:4px 0 10px}
.title .row{display:flex;gap:8px}
.sec{margin-top:18px}
.sec h3{font-size:15px;margin:0 4px 8px;display:flex;align-items:center;justify-content:space-between}
.sec h3 span{font-size:12px;color:var(--soft);font-weight:500}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:6px}
.stat div{background:#fff;padding:10px 6px;text-align:center}.stat small{display:block;font-size:11px;color:var(--soft)}.stat strong{font-size:17px}
.left0{color:var(--soft)!important}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.unit{background:#fff;border:1px solid var(--rule);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.unit b{display:block;font-size:17px}
.unit small{display:block;font-size:11px;color:var(--soft);margin-top:3px}
.unit.due{border-color:var(--amber);background:var(--amberbg)}
.unit.add{border-style:dashed;color:var(--teal);font-weight:700;background:transparent}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.sum div{background:#fff;padding:10px 6px;text-align:center}
.sum small{display:block;font-size:11px;color:var(--soft)}
.sum strong{font-size:15px}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;border-top:1px solid var(--rule);cursor:pointer}
.rec:first-child{border-top:0}
.rec .t{font-weight:700}
.rec .t span{color:var(--soft);font-weight:500;margin-right:6px}
.rec .d{font-size:12px;color:var(--soft)}
.rec .m{text-align:right;font-size:13px;color:var(--soft);line-height:1.5}
.rec .m b{color:var(--teal);font-size:15px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;margin-left:4px}
.tag.unpaid{background:var(--amberbg);color:var(--amberink);font-weight:700}
.tag.paid{background:#e3f4ee;color:var(--teal)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:15;
  width:min(640px,calc(100% - 24px));padding:15px;border:0;border-radius:12px;background:var(--teal);color:#fff;font:inherit;font-size:16px;font-weight:700;
  box-shadow:0 4px 14px rgba(15,107,94,.3)}
.hint{font-size:12px;color:var(--teal);background:var(--paper);border-radius:8px;padding:8px 10px;margin:-4px 0 10px;line-height:1.6}
.hint:empty{display:none}
.warn{background:#fdecea;color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px;line-height:1.5}

/* 입력 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(18,51,46,.45);display:none;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#fff;border-radius:18px 18px 0 0;max-width:680px;margin:0 auto;
  padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease}
#sheetWrap.open .sheet-bg,#buyWrap.open .sheet-bg{display:block} #sheetWrap.open .sheet,#buyWrap.open .sheet{transform:none}
.sheet h2{font-size:17px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:12px;color:var(--soft);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--rule);border-radius:8px;
  font:inherit;font-size:16px;color:var(--ink);background:#fff}
.chk{display:flex;align-items:center;gap:8px;margin:2px 0 14px;font-size:15px}
.chk input{width:20px;height:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns button{padding:13px;border-radius:10px;border:1px solid var(--rule);background:#fff;font:inherit;font-weight:700;color:var(--ink)}
.btns .pri{grid-column:1/-1;background:var(--teal);border-color:var(--teal);color:#fff}
.btns .del{color:var(--red)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;white-space:nowrap}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>하우스주택관리</h1><small id="count"></small></div>
  <nav class="tabs">
    <button data-tab="villa" class="on">빌라</button>
    <button data-tab="vendor">업체</button>
    <a href="/memo.html">장부</a>
  </nav>
</header>
<div class="bar" id="bar">
  <input class="search" id="q" type="search" placeholder="빌라 이름이나 번지로 찾기">
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<button class="fab" id="fab" hidden>+ 수리 기록</button>

<div id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" role="dialog" aria-label="수리 기록">
    <h2 id="sTitle">수리 기록</h2>
    <div class="g2">
      <label>날짜<input type="date" id="fDate"></label>
      <label>호수<input id="fUnit" inputmode="numeric" placeholder="예: 302"></label>
    </div>
    <label>내용<input id="fItem" list="itemList" placeholder="예: 수전, 폽업, 보일러" autocomplete="off"></label>
    <div class="hint" id="fHint"></div>
    <datalist id="itemList"></datalist>
    <div class="g2">
      <label>구분<select id="fKind"><option>수리</option><option>교체</option><option>설치</option><option>이사정산</option><option>기타</option></select></label>
      <label>청구가(원)<input id="fCharge" inputmode="numeric" placeholder="0"></label>
      <label id="qtyBox">재고에서 쓴 개수<input id="fQty" inputmode="numeric" value="1"></label>
      <label>청구대상<select id="fTarget"><option>건물주</option><option>세입자</option></select></label>
      <label>마진 (자동)<input id="fMargin" disabled></label>
    </div>
    <label>메모<input id="fMemo" placeholder="특이사항"></label>
    <div class="chk"><input type="checkbox" id="fPaid"><label for="fPaid" style="margin:0;color:var(--ink);font-size:15px">입금 받음</label></div>
    <div class="btns">
      <button class="pri" id="sSave">저장</button>
      <button id="sCancel">닫기</button>
      <button class="del" id="sDel">삭제</button>
    </div>
  </div>
</div>
<div id="buyWrap">
  <div class="sheet-bg" id="buyBg"></div>
  <div class="sheet" role="dialog" aria-label="구매 기록">
    <h2 id="bTitle">구매 기록</h2>
    <div class="g2">
      <label>날짜<input type="date" id="bDate"></label>
      <label>구입처<select id="bVendor"></select></label>
    </div>
    <label>품목<input id="bItem" list="partList" placeholder="예: 수전, 폽업" autocomplete="off"></label>
    <datalist id="partList"></datalist>
    <div class="g2">
      <label>수량<input id="bQty" inputmode="numeric" value="1"></label>
      <label>개당 가격(원)<input id="bPrice" inputmode="numeric" placeholder="0"></label>
    </div>
    <div class="hint" id="bHint"></div>
    <label>메모<input id="bMemo" placeholder="특이사항"></label>
    <div class="btns">
      <button class="pri" id="bSave">저장</button>
      <button id="bCancel">닫기</button>
      <button class="del" id="bDel">삭제</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script src="/villas.js"></script>
<script src="/stock.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== Firebase ===== */
firebase.initializeApp({
  apiKey:"AIzaSyBrMcbN2Iv3hjBW0uQx7_gSXAWcwTTSgGI",
  authDomain:"villa-management-4af75.firebaseapp.com",
  projectId:"villa-management-4af75",
  storageBucket:"villa-management-4af75.firebasestorage.app",
  messagingSenderId:"994416353525",
  appId:"1:994416353525:web:3bd200acc5d68f6df065bc"
});
const db = firebase.firestore();
db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
const LEDGER='ledger', UNITS='hUnits';   // 수리기록 = 장부와 같은 곳, 호수 = hUnits

let ledger=[], units=[], fbErr=null, tab='villa', dongSel='전체', editing=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>(n===null||n===undefined||n==='')?'-':Number(n).toLocaleString('ko-KR');
const toNum=s=>{const v=String(s??'').replace(/[^\d.-]/g,'');return v===''?null:Math.round(Number(v));};
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mapUrl=a=>'https://map.naver.com/p/search/'+encodeURIComponent(a);
const norm=s=>s.replace(/\s|\(|\)/g,'').toLowerCase();
const unitKey=u=>String(u||'').replace(/호$/,'').trim();
const unitSort=(a,b)=>(parseInt(a)||9999)-(parseInt(b)||9999)||a.localeCompare(b);
const unitDocId=(v,u)=>(v+'__'+u).replace(/\//g,'-');

/* ===== 데이터 ===== */
db.collection(LEDGER).onSnapshot(s=>{ ledger=s.docs.map(d=>({id:d.id,...d.data()})); fbErr=null; route(); }, e=>{ fbErr=e.code; route(); });
db.collection(UNITS).onSnapshot(s=>{ units=s.docs.map(d=>({id:d.id,...d.data()})); route(); }, e=>{ fbErr=e.code; route(); });
let purchases=[], stock={};
const PUR='purchases';
db.collection(PUR).onSnapshot(s=>{ purchases=s.docs.map(d=>({id:d.id,...d.data()})); route(); }, e=>{ fbErr=e.code; route(); });

function recordsOf(villa,unit){
  return ledger.filter(r=>r.villa===villa && (unit===undefined || unitKey(r.unit)===unit))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
}
function unitsOf(villa){
  const set=new Set(units.filter(u=>u.villa===villa).map(u=>unitKey(u.unit)));
  ledger.forEach(r=>{ if(r.villa===villa && unitKey(r.unit)) set.add(unitKey(r.unit)); });
  return [...set].filter(Boolean).sort(unitSort);
}

/* ===== 업체 · 재고 ===== */
const vShort=n=>n.replace(/\s*\(.*\)/,'');
const mmdd=d=>(d||'').slice(5).replace('-','/');
function partsOfVendor(vendor){
  return Object.values(stock).filter(e=>e.byVendor[vendor]).sort((a,b)=>a.name.localeCompare(b.name,'ko'));
}
function renderVendor(name){
  const v=VENDORS.find(x=>vShort(x.name)===name)||{name,addr:''};
  const ps=partsOfVendor(name);
  const left=ps.reduce((a,e)=>a+e.byVendor[name].left,0);
  $('count').textContent='업체';
  $('main').innerHTML=`
    <a class="back" href="#/">‹ 업체 목록</a>
    <div class="title"><h2>${esc(v.name)}</h2><small>${esc(v.addr||'')}</small>
      ${v.addr?`<div class="row"><button class="btn" data-copy="${esc(v.addr)}">주소 복사</button><a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">네이버지도</a></div>`:''}</div>
    ${warnBox()}
    <div class="sec"><h3>산 물건 <span>${ps.length}품목 · 남은 재고 ${left}개</span></h3>
    ${ps.length?`<div class="list">${ps.map(e=>{ const b=e.byVendor[name]; return `<div class="rec" data-part="${esc(e.name)}">
      <div><div class="t">${esc(e.name)}</div><div class="d">최근 ${mmdd(b.lastDate)} · 총 ${b.bought}개 삼</div></div>
      <div class="m num">남은 <b class="${b.left?'':'left0'}">${b.left}개</b><br>${won(b.lastPrice)}원</div></div>`; }).join('')}</div>`
      :'<div class="empty">아직 여기서 산 기록이 없어요.<br>아래 "+ 구매 기록"을 누르거나, 장부 메모에 "전진 수전 3개 12000" 처럼 적으세요.</div>'}</div>`;
}
function renderPart(vendor, partName){
  const e=stock[ikey(partName)];
  $('count').textContent='재고';
  if(!e){ location.hash='#/vendor/'+encodeURIComponent(vendor); return; }
  const lots=e.lots.slice().reverse();
  const uses=e.uses.slice().reverse(), dis=e.discards.slice().reverse();
  $('main').innerHTML=`
    <a class="back" href="#/vendor/${encodeURIComponent(vendor)}">‹ ${esc(vendor)}</a>
    <div class="title"><h2>${esc(e.name)}</h2><small>모든 구입처 합계</small></div>
    <div class="stat num"><div><small>산 개수</small><strong>${e.bought}</strong></div>
      <div><small>쓴 개수</small><strong>${e.used}</strong></div>
      <div><small>남은 개수</small><strong style="color:var(--teal)">${e.left}</strong></div></div>
    ${e.short?`<div class="warn">재고 없이 쓴 게 ${e.short}개 있어요 (얻었거나 구매 기록이 빠진 것, 원가 0원으로 계산)</div>`:''}
    <div class="sec"><h3>산 기록 <span>가게별 남은: ${Object.entries(e.byVendor).map(([k,b])=>`${esc(k)} ${b.left}개`).join(' · ')}</span></h3>
      <div class="list">${lots.map(l=>`<div class="rec" data-buy="${l.id}">
        <div><div class="t">${esc(l.vendor)}</div><div class="d">${esc(l.date||'')}${l.p.memo?' · '+esc(l.p.memo):''}</div></div>
        <div class="m num">${l.qty}개 × ${won(l.price)}<br><b>${won(l.price*l.qty)}</b> <span class="tag ${l.left?'paid':''}">남은 ${l.left}</span></div></div>`).join('')}</div></div>
    <div class="sec"><h3>쓴 곳 <span>${uses.length}건</span></h3>
      ${uses.length?`<div class="list">${uses.map(u=>`<div class="rec" data-goto="#/v/${encodeURIComponent(u.r.villa||'')}/${encodeURIComponent(unitKey(u.r.unit))}">
        <div><div class="t">${esc(u.r.villa||'')} ${esc(unitKey(u.r.unit))}호</div><div class="d">${esc(u.r.date||'')} · ${esc(u.r.item||'')}</div></div>
        <div class="m num">${u.qty}개<br>${u.from.map(f=>`${esc(f.lot.vendor)} ${won(f.lot.price)}`).join(', ')||'<span style="color:var(--red)">재고 없음</span>'}</div></div>`).join('')}</div>`
      :'<div class="empty">아직 쓴 곳이 없어요.</div>'}</div>
    ${dis.length?`<div class="sec"><h3>반품·폐기 <span>${dis.length}건</span></h3><div class="list">${dis.map(x=>`<div class="rec" data-buy="${x.p.id}">
      <div><div class="t">${esc(x.p.vendor||'')}</div><div class="d">${esc(x.date||'')}${x.p.memo?' · '+esc(x.p.memo):''}</div></div>
      <div class="m num">${x.qty}개 뺌</div></div>`).join('')}</div></div>`:''}
    <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
      <button class="btn" id="discardBtn">반품·폐기로 빼기</button></div>`;
}

/* ===== 화면 전환 (#/ , #/v/빌라 , #/v/빌라/호수) ===== */
function route(){
  stock=buildStock(purchases, ledger);
  const parts=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
  const detail = parts[0]==='v' && parts[1];
  const vend = parts[0]==='vendor' && parts[1];
  $('bar').classList.toggle('hide',!!(detail||vend));
  $('fab').hidden = !(detail||vend);
  $('fab').textContent = vend ? '+ 구매 기록' : '+ 수리 기록';
  if(vend){ parts[2] ? renderPart(parts[1], parts[2]) : renderVendor(parts[1]); return; }
  if(!detail){ renderList(); return; }
  const v=VILLA_LIST.find(x=>x.name===parts[1]);
  if(!v){ location.hash='#/'; return; }
  if(parts[2]) renderUnit(v, parts[2]); else renderVilla(v);
}
addEventListener('hashchange',()=>{ route(); scrollTo(0,0); });

function warnBox(){
  return fbErr ? `<div class="warn">기록을 못 불러왔어요 (${esc(fbErr)}). Firebase 규칙에서 읽기·쓰기를 허용해야 호수와 수리 기록이 저장돼요.</div>` : '';
}

/* 목록 */
function renderChips(){
  if(tab!=='villa'){ $('chips').innerHTML=''; return; }
  const cnt=d=>VILLA_LIST.filter(v=>v.dong===d).length;
  $('chips').innerHTML=['전체',...DONGS].map(d=>
    `<button class="chip${d===dongSel?' on':''}" data-d="${d}">${d} ${d==='전체'?VILLA_LIST.length:cnt(d)}</button>`).join('');
}
function renderList(){
  const q=norm($('q').value);
  if(tab==='villa'){
    $('count').textContent=`빌라 ${VILLA_LIST.length}곳`;
    let html=warnBox();
    for(const d of DONGS){
      if(dongSel!=='전체' && d!==dongSel) continue;
      const rows=VILLA_LIST.filter(v=>v.dong===d && (!q || norm(v.name+v.no).includes(q)))
        .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
      if(!rows.length) continue;
      html+=`<div class="dong"><h2>${d}</h2><span>${rows[0].gu} · ${rows.length}곳</span></div><div class="list">`+
        rows.map(v=>{ const n=unitsOf(v.name).length; return `<div class="item" data-go="${esc(v.name)}">
          <div class="nm"><b>${esc(v.name)}${n?`<em>${n}세대</em>`:''}</b><small>${esc(v.addr)}</small></div>
          <button class="btn" data-copy="${esc(v.addr)}">복사</button>
          <a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">지도</a>
        </div>`; }).join('')+'</div>';
    }
    $('main').innerHTML=html||'<div class="empty">찾는 빌라가 없어요. 이름을 다르게 쳐보세요.</div>';
  } else {
    $('count').textContent=`업체 ${VENDORS.length}곳`;
    const rows=VENDORS.filter(v=>!q||norm(v.name+v.addr).includes(q));
    $('main').innerHTML=rows.length?'<div class="dong"><h2>자재 구입처</h2></div><div class="list">'+rows.map(v=>{ const vn=vShort(v.name), n=partsOfVendor(vn).reduce((a,e)=>a+e.byVendor[vn].left,0); return `<div class="item" data-vgo="${esc(vShort(v.name))}">
      <div class="nm"><b>${esc(v.name)}${n?`<em>재고 ${n}개</em>`:''}</b><small>${esc(v.addr||(v.url?'온라인':'그 외 구입처'))}</small></div>
      ${v.addr?`<button class="btn" data-copy="${esc(v.addr)}">복사</button><a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">지도</a>`:''}
      ${v.url?`<a class="btn map" href="${v.url}" target="_blank" rel="noopener">열기</a>`:''}
    </div>`; }).join('')+'</div>':'<div class="empty">찾는 업체가 없어요.</div>';
  }
}

/* 빌라 상세: 호수 목록 */
function renderVilla(v){
  $('count').textContent=v.dong;
  const us=unitsOf(v.name), recs=recordsOf(v.name);
  const unpaid=recs.filter(r=>!r.paid && r.charge).reduce((a,r)=>a+Number(r.charge),0);
  $('main').innerHTML=`
    <a class="back" href="#/">‹ 빌라 목록</a>
    <div class="title"><h2>${esc(v.name)}</h2><small>${esc(v.addr)}</small>
      <div class="row"><button class="btn" data-copy="${esc(v.addr)}">주소 복사</button>
      <a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">네이버지도</a></div></div>
    ${warnBox()}
    <div class="sec"><h3>호수 <span>${us.length}세대${unpaid?` · 미수 ${won(unpaid)}원`:''}</span></h3>
      <div class="units">
        ${us.map(u=>{ const rs=recordsOf(v.name,u); const due=rs.some(r=>!r.paid&&r.charge);
          return `<button class="unit${due?' due':''}" data-unit="${esc(u)}"><b>${esc(u)}호</b><small>${rs.length?`기록 ${rs.length}건`:'기록 없음'}</small></button>`; }).join('')}
        <button class="unit add" id="addUnit">+ 호수</button>
      </div>
      ${us.length?'':'<div class="empty">아직 호수가 없어요.<br>수리하러 가면 아래 "+ 수리 기록"으로 적으세요. 호수가 자동으로 생겨요.</div>'}
    </div>
    ${recs.length?`<div class="sec"><h3>최근 기록 <span>${recs.length}건</span></h3><div class="list">${recs.slice(0,15).map(recRow).join('')}</div></div>`:''}`;
}

/* 호수 상세: 수리 기록 */
function renderUnit(v,u){
  $('count').textContent=v.name;
  const recs=recordsOf(v.name,u);
  const sum=k=>recs.reduce((a,r)=>a+(Number(r[k])||0),0);
  const unpaid=recs.filter(r=>!r.paid&&r.charge).reduce((a,r)=>a+Number(r.charge),0);
  $('main').innerHTML=`
    <a class="back" href="#/v/${encodeURIComponent(v.name)}">‹ ${esc(v.name)}</a>
    <div class="title"><h2>${esc(v.name)} ${esc(u)}호</h2><small>${esc(v.addr)}</small></div>
    ${warnBox()}
    <div class="sum num"><div><small>총 청구</small><strong>${won(sum('charge'))}</strong></div>
      <div><small>마진</small><strong style="color:var(--teal)">${won(recs.reduce((a,r)=>a+effMargin(stock,r),0))}</strong></div>
      <div><small>미수</small><strong style="color:var(--amberink)">${won(unpaid)}</strong></div></div>
    <div class="sec"><h3>수리 기록 <span>${recs.length}건</span></h3>
      ${recs.length?`<div class="list">${recs.map(recRow).join('')}</div>`:'<div class="empty">아직 기록이 없어요. 아래 "+ 수리 기록"을 누르세요.</div>'}
    </div>
    ${recs.length?'':`<div style="text-align:center;margin-top:10px"><button class="btn" id="delUnit">이 호수 지우기</button></div>`}`;
}
function recRow(r){
  return `<div class="rec" data-rec="${r.id}">
    <div><div class="t">${r.unit?`<span>${esc(unitKey(r.unit))}호</span>`:''}${esc(r.item||r.raw||'')}</div>
      <div class="d">${esc(r.date||'')} · ${esc(r.kind||'')}${r.part?` · 📦${esc(r.part)} ${r.partQty||1}개 (원가 ${won(effCost(stock,r))})`:''}${r.memo?' · '+esc(r.memo):''}</div></div>
    <div class="m num">청구 ${won(r.charge)}<br><b>${won(effMargin(stock,r))}</b>
      ${r.charge?(r.paid?'<span class="tag paid">입금</span>':'<span class="tag unpaid">미수</span>'):''}</div></div>`;
}

/* ===== 수리 기록 입력 ===== */
function curVilla(){ const p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/'); return {villa:p[1], unit:p[2]||''}; }
function openSheet(rec){
  editing=rec||null; const c=curVilla();
  $('sTitle').textContent = rec ? '기록 수정' : `${c.villa} 수리 기록`;
  $('fDate').value = rec?.date || ymd(new Date());
  $('fUnit').value = rec ? unitKey(rec.unit) : c.unit;
  $('fItem').value = rec?.item || '';
  $('fKind').value = rec?.kind && [...$('fKind').options].some(o=>o.value===rec.kind) ? rec.kind : '수리';
  $('fCharge').value = rec?.charge ?? ''; $('fQty').value = rec?.partQty || 1;
  $('fTarget').value = rec?.target || '건물주'; $('fMemo').value = rec?.memo || '';
  $('fPaid').checked = !!rec?.paid; $('sDel').style.display = rec ? '' : 'none';
  $('fItem').dataset.part = rec?.part || '';
  $('fHint').textContent='';
  $('itemList').innerHTML=[...new Set(ledger.map(r=>r.item).filter(Boolean))].slice(0,300).map(i=>`<option value="${esc(i)}">`).join('');
  fillPrice(); $('sheetWrap').classList.add('open');
  if(!rec) setTimeout(()=>($('fUnit').value?$('fItem'):$('fUnit')).focus(),250);
}
function fillPrice(){
  const item=$('fItem').value.trim();
  const part=findPart(item, Object.values(stock).map(e=>e.name));
  $('fItem').dataset.part=part;
  $('qtyBox').style.display = part ? '' : 'none';
  if(!part){ $('fHint').textContent = item ? '재고에 없는 물건이라 원가 0원으로 계산돼요 (얻었거나 안 산 것)' : ''; updMargin(); return; }
  const e=stock[ikey(part)];
  const mine = editing && editing.part ? (editing.partQty||1) : 0;   // 수정 중이면 이 기록이 쓴 만큼은 재고로 돌려놓고 봄
  const vs=Object.entries(e.byVendor).map(([k,b])=>`${esc(k)} ${b.left}개`).join(' · ');
  $('fHint').innerHTML=`📦 <b>${esc(part)}</b> 재고 ${e.left+mine}개 (${vs})<br>저장하면 재고에서 빠지고 원가가 자동으로 잡혀요`;
  updMargin();
}
function closeSheet(){ $('sheetWrap').classList.remove('open'); editing=null; }
function estCost(){
  const part=$('fItem').dataset.part; if(!part){ return editing&&!editing.part ? (Number(editing.cost)||0) : 0; }
  const e=stock[ikey(part)]; let need=toNum($('fQty').value)||1, cost=0;
  const lots=e.lots.map(l=>({price:l.price,left:l.left}));
  if(editing && editing.part){ const u=e.uses.find(x=>x.r.id===editing.id); u&&u.from.forEach(f=>{ const l=lots[e.lots.indexOf(f.lot)]; l.left+=f.qty; }); }
  for(const l of lots){ if(need<=0) break; const t=Math.min(l.left,need); cost+=t*l.price; need-=t; }
  return cost;
}
function updMargin(){ const c=estCost(); $('fMargin').value=won((toNum($('fCharge').value)??0)-c)+(c?` (원가 ${won(c)})`:''); }
function saveSheet(){
  const c=curVilla(), unit=unitKey($('fUnit').value), item=$('fItem').value.trim();
  if(!unit){ toast('호수를 적어주세요'); $('fUnit').focus(); return; }
  if(!item){ toast('내용을 적어주세요'); $('fItem').focus(); return; }
  const charge=toNum($('fCharge').value), part=findPart(item, Object.values(stock).map(e=>e.name))||'', cost=estCost();
  const data={ villa: editing?.villa || c.villa, unit, item, date:$('fDate').value, kind:$('fKind').value, 
    charge, margin:(charge??0)-cost, target:$('fTarget').value, memo:$('fMemo').value.trim(), paid:$('fPaid').checked, needsCheck:false,
    part, partQty: part ? (toNum($('fQty').value)||1) : 0 };
  if(!editing || editing.part || part) data.cost = part ? null : (editing ? (editing.cost??null) : null);
  const p = editing ? db.collection(LEDGER).doc(editing.id).update(data)
                    : db.collection(LEDGER).add({...data, raw:'', createdAt:Date.now()});
  p.catch(e=>toast('저장 실패: '+e.code));
  db.collection(UNITS).doc(unitDocId(data.villa,unit)).set({villa:data.villa, unit},{merge:true}).catch(()=>{});
  closeSheet(); toast(navigator.onLine?'저장했어요':'폰에 저장, 연결되면 올라가요');
}
function delRecord(){
  if(!editing||!confirm('이 기록을 지울까요?')) return;
  db.collection(LEDGER).doc(editing.id).delete().catch(e=>toast('삭제 실패: '+e.code));
  closeSheet(); toast('지웠어요');
}

/* ===== 구매 기록 입력 ===== */
let buying=null;
$('bVendor').innerHTML=VENDORS.map(v=>`<option>${esc(vShort(v.name))}</option>`).join('');
function openBuy(rec, preset={}){
  buying=rec||null;
  $('bTitle').textContent = rec ? (rec.qty<0?'반품·폐기 수정':'구매 기록 수정') : (preset.discard?'반품·폐기':'구매 기록');
  $('bDate').value = rec?.date || ymd(new Date());
  $('bVendor').value = rec?.vendor || preset.vendor || VENDORS[0] && vShort(VENDORS[0].name);
  $('bItem').value = rec?.item || preset.item || '';
  $('bQty').value = rec ? Math.abs(rec.qty) : 1;
  $('bPrice').value = rec?.unitPrice ?? '';
  $('bMemo').value = rec?.memo || '';
  $('buyWrap').dataset.discard = (rec ? rec.qty<0 : !!preset.discard) ? '1' : '';
  $('bPrice').parentElement.style.display = $('buyWrap').dataset.discard ? 'none' : '';
  $('bDel').style.display = rec ? '' : 'none';
  $('partList').innerHTML=Object.values(stock).map(e=>`<option value="${esc(e.name)}">`).join('');
  bHint(); $('buyWrap').classList.add('open');
  if(!rec && !preset.item) setTimeout(()=>$('bItem').focus(),250);
}
function bHint(){
  const q=toNum($('bQty').value)||0, pr=toNum($('bPrice').value);
  const e=stock[ikey($('bItem').value)];
  let h = (!$('buyWrap').dataset.discard && pr!=null) ? `합계 ${won(q*pr)}원` : '';
  if(e){ const b=e.byVendor[$('bVendor').value]; h += (h?'<br>':'')+`지금 재고 ${e.left}개`+(b?` · 여기 마지막 ${won(b.lastPrice)}원 (${mmdd(b.lastDate)})`:''); }
  $('bHint').innerHTML=h;
}
function closeBuy(){ $('buyWrap').classList.remove('open'); buying=null; }
function saveBuy(){
  const item=$('bItem').value.trim(), qty=toNum($('bQty').value), pr=toNum($('bPrice').value);
  if(!item){ toast('품목을 적어주세요'); $('bItem').focus(); return; }
  if(!qty||qty<=0){ toast('수량을 적어주세요'); $('bQty').focus(); return; }
  const dis=!!$('buyWrap').dataset.discard;
  const data={date:$('bDate').value, vendor:$('bVendor').value, item, qty: dis?-qty:qty,
    unitPrice: dis?null:pr, total: dis||pr==null?null:pr*qty, memo:$('bMemo').value.trim()};
  (buying ? db.collection(PUR).doc(buying.id).update(data) : db.collection(PUR).add({...data, raw:'', createdAt:Date.now()}))
    .catch(e=>toast('저장 실패: '+e.code));
  closeBuy(); toast(navigator.onLine?'저장했어요':'폰에 저장, 연결되면 올라가요');
}
function delBuy(){
  if(!buying||!confirm('이 기록을 지울까요?')) return;
  db.collection(PUR).doc(buying.id).delete().catch(e=>toast('삭제 실패: '+e.code));
  closeBuy(); toast('지웠어요');
}
$('buyBg').onclick=closeBuy; $('bCancel').onclick=closeBuy; $('bSave').onclick=saveBuy; $('bDel').onclick=delBuy;
['bQty','bPrice','bItem','bVendor'].forEach(id=>$(id).addEventListener('input',bHint));

/* ===== 이벤트 ===== */
let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
document.querySelector('.tabs').addEventListener('click',e=>{
  const t=e.target.dataset.tab; if(!t) return;
  tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('q').value=''; $('q').placeholder=t==='villa'?'빌라 이름이나 번지로 찾기':'업체 이름으로 찾기';
  renderChips(); if(location.hash && location.hash!=='#/') location.hash='#/'; else renderList(); scrollTo(0,0);
});
$('chips').addEventListener('click',e=>{const d=e.target.dataset.d; if(!d) return; dongSel=d; renderChips(); renderList(); scrollTo(0,0);});
$('q').addEventListener('input',renderList);
$('main').addEventListener('click',e=>{
  const cp=e.target.closest('[data-copy]');
  if(cp){ e.stopPropagation(); const a=cp.dataset.copy;
    (navigator.clipboard?.writeText(a)||Promise.reject()).then(()=>toast('주소 복사했어요'),()=>prompt('복사해서 쓰세요',a)); return; }
  if(e.target.closest('a')) return;
  const pt=e.target.closest('[data-part]'); if(pt){ const p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/'); location.hash=`#/vendor/${encodeURIComponent(p[1])}/${encodeURIComponent(pt.dataset.part)}`; return; }
  const by=e.target.closest('[data-buy]'); if(by){ openBuy(purchases.find(x=>x.id===by.dataset.buy)); return; }
  const gt=e.target.closest('[data-goto]'); if(gt){ location.hash=gt.dataset.goto; return; }
  if(e.target.id==='discardBtn'){ const p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/'); openBuy(null,{vendor:p[1],item:stock[ikey(p[2])]?.name||p[2],discard:true}); return; }
  const vg=e.target.closest('[data-vgo]'); if(vg){ location.hash='#/vendor/'+encodeURIComponent(vg.dataset.vgo); return; }
  const go=e.target.closest('[data-go]'); if(go){ location.hash='#/v/'+encodeURIComponent(go.dataset.go); return; }
  const un=e.target.closest('[data-unit]'); if(un){ location.hash=`#/v/${encodeURIComponent(curVilla().villa)}/${encodeURIComponent(un.dataset.unit)}`; return; }
  const rc=e.target.closest('[data-rec]'); if(rc){ openSheet(ledger.find(r=>r.id===rc.dataset.rec)); return; }
  if(e.target.id==='addUnit'){
    const u=unitKey(prompt('호수를 적어주세요 (예: 302)')||''); if(!u) return;
    const v=curVilla().villa;
    db.collection(UNITS).doc(unitDocId(v,u)).set({villa:v,unit:u},{merge:true}).catch(e=>toast('저장 실패: '+e.code));
    location.hash=`#/v/${encodeURIComponent(v)}/${encodeURIComponent(u)}`; return;
  }
  if(e.target.id==='delUnit'){
    const c=curVilla(); if(!confirm(`${c.unit}호를 목록에서 지울까요?`)) return;
    db.collection(UNITS).doc(unitDocId(c.villa,c.unit)).delete().catch(()=>{});
    location.hash='#/v/'+encodeURIComponent(c.villa);
  }
});
$('fab').onclick=()=>{
  const p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
  if(p[0]==='vendor') openBuy(null,{vendor:p[1], item:p[2]?(stock[ikey(p[2])]?.name||p[2]):''}); else openSheet();
};
$('sheetBg').onclick=closeSheet; $('sCancel').onclick=closeSheet; $('sSave').onclick=saveSheet; $('sDel').onclick=delRecord;
$('fCharge').oninput=updMargin; $('fQty').oninput=updMargin;
$('fItem').addEventListener('change',fillPrice);
$('fItem').addEventListener('input',fillPrice);
$('fItem').addEventListener('blur',fillPrice);
const fixBar=()=>$('bar').style.top=document.querySelector('header').offsetHeight+'px';
fixBar(); addEventListener('resize',fixBar);
renderChips(); route();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
