<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b5e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>하우스주택관리</title>
<style>
:root{--paper:#eef6f3;--ink:#12332e;--soft:#5b7a73;--teal:#0f6b5e;--rule:#cfe3dd;--amber:#e0a43a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--paper);color:var(--ink);
  font-size:15px;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:20;background:var(--teal);color:#fff;padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:baseline;justify-content:space-between;padding:12px 16px 8px}
.top h1{font-size:18px;font-weight:700}
.top small{font-size:12px;opacity:.8}
.tabs{display:flex}
.tabs a,.tabs button{flex:1;text-align:center;padding:11px 0;background:none;border:0;color:rgba(255,255,255,.7);
  font:inherit;font-size:15px;font-weight:700;text-decoration:none;border-bottom:3px solid transparent}
.tabs .on{color:#fff;border-bottom-color:var(--amber)}
.bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);z-index:10;background:var(--paper);padding:10px 12px 8px;border-bottom:1px solid var(--rule)}
.search{width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.chip{flex:none;padding:6px 12px;border-radius:16px;border:1px solid var(--rule);background:#fff;font:inherit;font-size:13px;font-weight:600;color:var(--soft)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{max-width:680px;margin:0 auto;padding:6px 12px 40px}
.dong{display:flex;align-items:baseline;gap:8px;margin:16px 4px 6px}
.dong h2{font-size:16px}
.dong span{font-size:12px;color:var(--soft)}
.list{background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 14px;border-top:1px solid var(--rule)}
.item:first-child{border-top:0}
.item .nm{flex:1;min-width:0}
.item b{display:block;font-size:16px}
.item small{display:block;font-size:12px;color:var(--soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{flex:none;padding:8px 11px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--teal);
  font:inherit;font-size:13px;font-weight:700;text-decoration:none}
.btn.map{background:var(--teal);border-color:var(--teal);color:#fff}
.empty{text-align:center;color:var(--soft);padding:40px 10px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="top"><h1>하우스주택관리</h1><small id="count"></small></div>
  <nav class="tabs">
    <button data-tab="villa" class="on">빌라</button>
    <button data-tab="vendor">업체</button>
    <a href="/memo.html">장부</a>
  </nav>
</header>

<div class="bar">
  <input class="search" id="q" type="search" placeholder="빌라 이름이나 번지로 찾기">
  <div class="chips" id="chips"></div>
</div>
<main id="main"></main>
<div id="toast"></div>

<script>
/* ===== 빌라 목록 (동, 구, 이름, 주소) ===== */
const VILLAS = [
  // 대덕구 목상동
  ['목상동','대덕구','엘하우스','864-1'],['목상동','대덕구','골든하우스','864-12'],['목상동','대덕구','테크노빌','864-5'],
  ['목상동','대덕구','노블레스빌','864-8'],['목상동','대덕구','센트럴파크','865-18'],['목상동','대덕구','이룸하우스','865-16'],
  ['목상동','대덕구','플로리시','865-19'],['목상동','대덕구','써니빌','865-7'],['목상동','대덕구','유니빌','865-12'],
  ['목상동','대덕구','한성빌라','865-9'],['목상동','대덕구','인하우스','865-10'],['목상동','대덕구','엘림빌','146-9'],
  ['목상동','대덕구','새롬빌','152-17'],['목상동','대덕구','그린빌','152-1'],['목상동','대덕구','우정하우스','165-2'],
  ['목상동','대덕구','지중해빌라','145-17'],['목상동','대덕구','맑은햇살빌','145-3'],['목상동','대덕구','노다지빌','145-4'],
  ['목상동','대덕구','14번가','145-14'],['목상동','대덕구','덕윤빌딩','145-5'],['목상동','대덕구','블레싱홈','145-12'],
  ['목상동','대덕구','궁전빌','145-7'],['목상동','대덕구','미하스빌','145-8'],['목상동','대덕구','승주빌라','862-2'],
  ['목상동','대덕구','주안빌리지','159-1'],['목상동','대덕구','모닝빌','149-12'],['목상동','대덕구','새뜰빌라','152-6'],
  ['목상동','대덕구','더편한빌','156-16'],['목상동','대덕구','그림아트빌라','156-15'],['목상동','대덕구','광명주택','156-14'],
  ['목상동','대덕구','크로바빌(목상)','156-12'],['목상동','대덕구','한아름빌','156-11'],['목상동','대덕구','현주주택','176-1'],
  ['목상동','대덕구','송학마을','176-12'],['목상동','대덕구','보금자리','176-6'],['목상동','대덕구','목상빌라','861-3'],
  ['목상동','대덕구','양지마을빌라','861-11'],['목상동','대덕구','풀하우스','861-10'],['목상동','대덕구','청실빌라','859-1'],
  ['목상동','대덕구','성보빌','859-4'],['목상동','대덕구','필하우스','859-3'],['목상동','대덕구','황금빌','860-1'],
  ['목상동','대덕구','상임빌리지','860-2'],['목상동','대덕구','청솔빌라','860-3'],['목상동','대덕구','토마토하우스','185-4'],
  ['목상동','대덕구','평안빌라','209'],['목상동','대덕구','해오름빌','202-2'],
  // 대덕구 석봉동
  ['석봉동','대덕구','트윈1','석봉로44번안길 11-15'],['석봉동','대덕구','트윈2','319-14'],['석봉동','대덕구','시그너스빌','207-6'],
  ['석봉동','대덕구','금강로하스','308-18'],['석봉동','대덕구','미래빌리지','312-19'],
  // 대덕구 신탄진동·덕암동
  ['신탄진동','대덕구','하이트빌','130-2'],['신탄진동','대덕구','에코빌라','136-13'],['신탄진동','대덕구','영하우스','136-34'],
  ['신탄진동','대덕구','다원하우스','155-22'],['덕암동','대덕구','바로크','6-17'],
  // 유성구 봉산동
  ['봉산동','유성구','시드니힐','179-14'],['봉산동','유성구','베토벤하우스','181-12'],['봉산동','유성구','더레미안빌','197-4'],
  ['봉산동','유성구','은하수빌','202-10'],['봉산동','유성구','크로바빌(봉산)','203-3'],['봉산동','유성구','토리하우스','206-14'],
  ['봉산동','유성구','더갤러리','208-1'],['봉산동','유성구','뉴캐슬','218-11'],['봉산동','유성구','오페라','274-8'],
  ['봉산동','유성구','숲속의향기','290-6'],
  // 유성구 송강동·전민동·관평동
  ['송강동','유성구','화인캐슬','186-13'],['송강동','유성구','예다움빌','186-11'],['송강동','유성구','해피하우스','177-11'],
  ['송강동','유성구','해움빌라','172-10'],['송강동','유성구','초콜릿하우스','182-9'],['송강동','유성구','미리내숲','182-2'],
  ['전민동','유성구','글로리빌','459-1'],['관평동','유성구','관평1214','1214']
];
const DONGS = ['목상동','석봉동','신탄진동','덕암동','봉산동','송강동','전민동','관평동'];

/* ===== 업체 ===== */
const VENDORS = [
  {name:'전진철물점', addr:'대전 중구 선화동 163-40'},
  {name:'장땡타일 (장원산업대리점)', addr:'대전 서구 변동 49-12'},
  {name:'라온조명', addr:'대전 중구 용두동 131-13 1층'},
  {name:'인터넷 (쿠팡)', addr:'', url:'https://www.coupang.com'},
  {name:'기타', addr:''}
];

const villas = VILLAS.map(([dong,gu,name,no])=>({
  dong, gu, name, no,
  addr: no.includes('로') ? `대전 ${gu} ${no}` : `대전 ${gu} ${dong} ${no}`
}));

let tab='villa', dongSel='전체';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapUrl=a=>'https://map.naver.com/p/search/'+encodeURIComponent(a);
const norm=s=>s.replace(/\s|\(|\)/g,'').toLowerCase();

function renderChips(){
  if(tab!=='villa'){ $('chips').innerHTML=''; return; }
  const cnt=d=>villas.filter(v=>v.dong===d).length;
  $('chips').innerHTML=['전체',...DONGS].map(d=>
    `<button class="chip${d===dongSel?' on':''}" data-d="${d}">${d}${d==='전체'?' '+villas.length:' '+cnt(d)}</button>`).join('');
}
function render(){
  const q=norm($('q').value);
  if(tab==='villa'){
    $('count').textContent=`빌라 ${villas.length}곳`;
    let html='';
    for(const d of DONGS){
      if(dongSel!=='전체' && d!==dongSel) continue;
      const rows=villas.filter(v=>v.dong===d && (!q || norm(v.name+v.no).includes(q)))
        .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
      if(!rows.length) continue;
      html+=`<div class="dong"><h2>${d}</h2><span>${rows[0].gu} · ${rows.length}곳</span></div><div class="list">`+
        rows.map(v=>`<div class="item">
          <div class="nm"><b>${esc(v.name)}</b><small>${esc(v.addr)}</small></div>
          <button class="btn" data-copy="${esc(v.addr)}">복사</button>
          <a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">지도</a>
        </div>`).join('')+'</div>';
    }
    $('main').innerHTML=html||'<div class="empty">찾는 빌라가 없어요. 이름을 다르게 쳐보세요.</div>';
  } else {
    $('count').textContent=`업체 ${VENDORS.length}곳`;
    const rows=VENDORS.filter(v=>!q||norm(v.name+v.addr).includes(q));
    $('main').innerHTML=rows.length?'<div class="dong"><h2>자재 구입처</h2></div><div class="list">'+rows.map(v=>`<div class="item">
      <div class="nm"><b>${esc(v.name)}</b><small>${esc(v.addr||(v.url?'온라인':'그 외 구입처'))}</small></div>
      ${v.addr?`<button class="btn" data-copy="${esc(v.addr)}">복사</button><a class="btn map" href="${mapUrl(v.addr)}" target="_blank" rel="noopener">지도</a>`:''}
      ${v.url?`<a class="btn map" href="${v.url}" target="_blank" rel="noopener">열기</a>`:''}
    </div>`).join('')+'</div>':'<div class="empty">찾는 업체가 없어요.</div>';
  }
}

let tt;function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),1800)}
document.querySelector('.tabs').addEventListener('click',e=>{
  const t=e.target.dataset.tab; if(!t) return;
  tab=t; document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  $('q').value=''; $('q').placeholder = t==='villa'?'빌라 이름이나 번지로 찾기':'업체 이름으로 찾기';
  renderChips(); render(); scrollTo(0,0);
});
$('chips').addEventListener('click',e=>{const d=e.target.dataset.d; if(!d) return; dongSel=d; renderChips(); render(); scrollTo(0,0);});
$('q').addEventListener('input',render);
$('main').addEventListener('click',e=>{
  const a=e.target.dataset.copy; if(!a) return;
  (navigator.clipboard?.writeText(a)||Promise.reject()).then(()=>toast('주소 복사했어요'),()=>prompt('복사해서 쓰세요',a));
});
const fixBar=()=>document.querySelector('.bar').style.top=document.querySelector('header').offsetHeight+'px';
fixBar(); addEventListener('resize',fixBar);
renderChips(); render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
